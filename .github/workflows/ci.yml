name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build NYRI-WIN10.sln -c Release
      - name: Shell, activity, privacy and UI smoke tests
        run: dotnet run --project tests/Nyri.SmokeTests -c Release
